<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Happy Birthday!</title>
    <style>
        /* =========================================
           BASE STYLES & KRAFT PAPER BACKGROUND
           ========================================= */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #d4b595;
            /* Simple Kraft paper texture using radial gradients */
            background-image: 
                radial-gradient(circle, rgba(0,0,0,0.02) 1px, transparent 1px),
                radial-gradient(circle, rgba(0,0,0,0.02) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            perspective: 2000px; /* For 3D environment */
        }

        /* =========================================
           CARD 3D STRUCTURE
           ========================================= */
        .scene {
            position: relative;
            /* Size ensures spread fits cleanly in viewport */
            width: 45vw;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            /* Slightly shifted up so it doesn't touch the top or bottom */
            transform: translateY(-2vh);
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* When opened, shift the whole book right so the spread stays perfectly centered */
        .book.is-open {
            transform: translateX(50%);
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            background: #fcf9f2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-radius: 4px;
            transform-style: preserve-3d;
        }

        /* Right Page (Cake) */
        .page-right {
            z-index: 1;
            overflow: hidden;
        }

        /* Cover Group (Front Cover + Inside Left) */
        .cover-group {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 2;
        }

        .book.is-open .cover-group {
            transform: rotateY(-180deg);
        }

        .cover-front, .cover-inside {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            top: 0; left: 0;
            border-radius: 4px;
            overflow: hidden;
        }

        .cover-front {
            z-index: 2;
            transform: rotateY(0deg);
            cursor: pointer;
        }

        .cover-inside {
            transform: rotateY(180deg);
            z-index: 1;
            cursor: pointer;
        }

        .fit-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* =========================================
           UI CONTROLS
           ========================================= */
        .ui-btn {
            background: #4a5c4e;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
        }
        .ui-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 3px rgba(0,0,0,0.2);
        }

        #closeBtn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 50;
        }
        .book.is-open ~ #closeBtn {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* =========================================
           LETTER INTERACTION (LEFT PAGE)
           ========================================= */
        .letter-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }
        .letter-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .letter-full {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            transform: translateY(100px) scale(0.8);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        .letter-overlay.active .letter-full {
            transform: translateY(0) scale(1);
        }

        /* =========================================
           CANDLES & BLOWING INTERACTION (RIGHT PAGE)
           ========================================= */
        .flames-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }
        
        .flame {
            position: absolute;
            width: 6%; 
            height: 6%;
            background: radial-gradient(ellipse at bottom, #ffdb58 10%, #ff8c00 50%, transparent 80%);
            border-radius: 50% 50% 20% 20%;
            filter: drop-shadow(0 0 8px #ff8c00);
            transform-origin: bottom center;
            animation: flicker 0.12s infinite alternate;
            transition: opacity 0.3s ease;
        }

        /* Adjust these percentages if the CSS flames don't perfectly cover the drawn ones in 4.jpg */
        .flame-1 { left: 33%; top: 41%; }
        .flame-2 { left: 47.5%; top: 38%; }
        .flame-3 { left: 61%; top: 42%; }

        @keyframes flicker {
            0% { transform: scale(1) skewX(-2deg); opacity: 0.9; }
            100% { transform: scale(1.1) skewX(2deg); opacity: 1; }
        }

        .blowing .flame {
            transform: skewX(-35deg) scale(0.9);
            animation: none; /* Stop flickering, just bend */
            filter: drop-shadow(0 0 2px #ff8c00);
        }

        .blown-out .flame {
            opacity: 0;
            transition: opacity 0.1s;
        }

        /* MIC UI */
        .audio-ui {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .meter-box {
            width: 60%;
            height: 10px;
            background: rgba(255,255,255,0.5);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: #ff5722;
            transition: width 0.1s;
        }
        .mic-status {
            font-size: 12px;
            color: #555;
            background: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* =========================================
           WISH MESSAGE & CONFETTI
           ========================================= */
        .wish-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            text-align: center;
            z-index: 10;
        }
        .blown-out .wish-screen {
            opacity: 1;
            pointer-events: auto;
        }
        .wish-screen h2 {
            color: #d15656;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 1px 1px 0px #fff;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            z-index: 200;
            pointer-events: none;
            animation: fall linear forwards;
        }
        @keyframes fall {
            to { transform: translateY(105vh) rotate(720deg); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .scene { width: 45vw; } 
            .wish-screen h2 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="book" id="book">
            
            <!-- RIGHT PAGE: Cake & Candles -->
            <div class="page page-right">
                <img src="4.jpg" class="fit-img" alt="Cake">
                
                <div class="flames-container" id="flamesContainer">
                    <!-- If you export transparent flames as PNGs, replace these divs with:
                         <img src="flame.png" class="flame flame-1"> -->
                    <div class="flame flame-1"></div>
                    <div class="flame flame-2"></div>
                    <div class="flame flame-3"></div>
                </div>

                <div class="audio-ui" id="audioUi">
                    <div class="mic-status" id="micStatus">Allow mic to blow candles!</div>
                    <div class="meter-box">
                        <div class="meter-fill" id="micLevel"></div>
                    </div>
                    <button class="ui-btn" id="fallbackBtn">Hold to Blow</button>
                </div>

                <div class="wish-screen" id="wishScreen">
                    <h2>Make a wish, Аннуш!</h2>
                    <button class="ui-btn" id="relightBtn">Relight Candles</button>
                </div>
            </div>

            <!-- COVER GROUP: Hinges on the left -->
            <div class="cover-group">
                <!-- INSIDE LEFT: Envelope with letter peeking -->
                <div class="cover-inside" id="envelopePage">
                    <img src="2.jpg" class="fit-img" alt="Envelope">
                </div>
                <!-- FRONT COVER -->
                <div class="cover-front" id="coverPage">
                    <img src="1.jpg" class="fit-img" alt="Cover">
                </div>
            </div>
            
        </div>
    </div>

    <!-- Back to Cover Button -->
    <button id="closeBtn" class="ui-btn">Back to Cover</button>

    <!-- FULL LETTER OVERLAY (Pops up when clicking envelope) -->
    <div class="letter-overlay" id="letterOverlay">
        <img src="3.jpg" class="letter-full" alt="Full Letter">
    </div>

    <script>
        /* =========================================
           CARD NAVIGATION LOGIC
           ========================================= */
        const book = document.getElementById('book');
        const coverPage = document.getElementById('coverPage');
        const closeBtn = document.getElementById('closeBtn');
        const envelopePage = document.getElementById('envelopePage');
        const letterOverlay = document.getElementById('letterOverlay');

        // Open Card
        coverPage.addEventListener('click', () => {
            book.classList.add('is-open');
            initMic(); // Request mic permissions only when user interacts (browser policy)
        });

        // Close Card
        closeBtn.addEventListener('click', () => {
            book.classList.remove('is-open');
        });

        // Read Letter
        envelopePage.addEventListener('click', () => {
            letterOverlay.classList.add('active');
        });
        
        // Tuck Letter back in
        letterOverlay.addEventListener('click', () => {
            letterOverlay.classList.remove('active');
        });

        /* =========================================
           MIC & AUDIO API LOGIC
           ========================================= */
        let audioCtx, analyser, dataArray;
        let micInitialized = false;
        let blowTimer = 0;
        const blowThreshold = 500; // ms required to blow out
        
        async function initMic() {
            if (micInitialized) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                micInitialized = true;
                document.getElementById('micStatus').innerText = "Mic active! Blow into it.";
                monitorAudio();
            } catch (err) {
                console.warn("Mic access denied or unavailable (HTTP). Using fallback.");
                document.getElementById('micStatus').innerText = "Mic unavailable. Use button.";
            }
        }

        function monitorAudio() {
            if (book.classList.contains('blown-out')) return;
            
            analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for(let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let avg = sum / dataArray.length;

            // Fill meter UI
            const levelBox = document.getElementById('micLevel');
            levelBox.style.width = Math.min(avg * 1.5, 100) + '%';

            // Detect blowing
            if (avg > 35) { // Sensitivity threshold
                book.classList.add('blowing');
                blowTimer += 16; 
                if (blowTimer > blowThreshold) {
                    blowOutCandles();
                }
            } else {
                book.classList.remove('blowing');
                blowTimer = 0;
            }
            requestAnimationFrame(monitorAudio);
        }

        /* =========================================
           FALLBACK BUTTON LOGIC (HOLD TO BLOW)
           ========================================= */
        const fallbackBtn = document.getElementById('fallbackBtn');
        let holdInterval;

        function startManualBlow(e) {
            e.preventDefault();
            if (book.classList.contains('blown-out')) return;
            book.classList.add('blowing');
            document.getElementById('micLevel').style.width = '100%';
            
            holdInterval = setInterval(() => {
                blowTimer += 50;
                if (blowTimer > blowThreshold) {
                    blowOutCandles();
                    stopManualBlow();
                }
            }, 50);
        }

        function stopManualBlow(e) {
            if(e) e.preventDefault();
            clearInterval(holdInterval);
            book.classList.remove('blowing');
            document.getElementById('micLevel').style.width = '0%';
            blowTimer = 0;
        }

        fallbackBtn.addEventListener('mousedown', startManualBlow);
        fallbackBtn.addEventListener('touchstart', startManualBlow);
        window.addEventListener('mouseup', stopManualBlow);
        window.addEventListener('touchend', stopManualBlow);
        
        // Spacebar fallback
        window.addEventListener('keydown', (e) => {
            if(e.code === 'Space' && book.classList.contains('is-open')) startManualBlow(e);
        });
        window.addEventListener('keyup', (e) => {
            if(e.code === 'Space') stopManualBlow();
        });

        /* =========================================
           WISH & CONFETTI LOGIC
           ========================================= */
        function blowOutCandles() {
            book.classList.remove('blowing');
            book.classList.add('blown-out');
            setTimeout(shootConfetti, 300);
        }

        function shootConfetti() {
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#4caf50', '#ffeb3b', '#ff9800'];
            for(let i = 0; i < 60; i++) {
                let conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-10px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Randomize shape (some squares, some thin rectangles)
                if(Math.random() > 0.5) conf.style.width = '5px';
                
                conf.style.animationDuration = (Math.random() * 2 + 2) + 's';
                conf.style.animationDelay = (Math.random() * 0.5) + 's';
                
                document.body.appendChild(conf);
                
                // Cleanup
                setTimeout(() => { conf.remove(); }, 5000);
            }
        }

        // Relight 
        document.getElementById('relightBtn').addEventListener('click', () => {
            book.classList.remove('blown-out');
            blowTimer = 0;
            if(micInitialized) {
                monitorAudio(); // restart monitor loop
            }
        });
    </script>
</body>
</html>
