<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>С днём рождения, Аннуш!</title>
<style>
  :root{
    --kraft:#cdb289;
    --kraft-deep:#b8996b;
    --cream:#f8f1e2;
    --ink:#3c2a1d;
    --maroon:#7a1f30;
    --maroon-deep:#551221;
    --sage:#3f5b42;
    --pink:#e8b7ba;
    --gold:#d9a441;
    --pageH: 480px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    overscroll-behavior-y:contain;
  }
  body{
    min-height:100svh;
    background-color:var(--kraft);
    background-image:
      radial-gradient(ellipse 60% 40% at 18% 8%, rgba(255,255,255,.16), transparent 55%),
      radial-gradient(ellipse 50% 40% at 85% 95%, rgba(0,0,0,.10), transparent 55%),
      url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj4KPGZpbHRlciBpZD0ibiI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9IjAuOSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjxmZUNvbG9yTWF0cml4IHR5cGU9Im1hdHJpeCIgdmFsdWVzPSIwIDAgMCAwIDAuMjQgIDAgMCAwIDAgMC4xNiAgMCAwIDAgMCAwLjA4ICAwIDAgMCAwLjA1IDAiLz48L2ZpbHRlcj4KPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsdGVyPSJ1cmwoI24pIi8+Cjwvc3ZnPgo=");
    background-blend-mode:normal;
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .script{
    font-family:"Segoe Script","Bradley Hand","Lucida Handwriting",cursive;
  }

  button{ font-family:inherit; }

  .stage{
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:7vh 16px 48px;
  }

  #bookWrap{
    position:relative;
    width:100%;
    max-width:900px;
    height:var(--pageH);
    perspective:1800px;
  }

  /* ---------- COVER ---------- */
  #cover{
    position:absolute;
    top:50%; left:50%;
    height:var(--pageH);
    width:calc(var(--pageH) * 0.8);
    transform: translate(-50%,-50%) rotateY(0deg);
    transform-style:preserve-3d;
    backface-visibility:hidden;
    transition: transform .65s cubic-bezier(.4,.1,.2,1), opacity .5s ease;
    cursor:pointer;
    z-index:3;
    touch-action:manipulation;
    border-radius:14px;
    box-shadow: 0 4px 10px rgba(50,28,14,.18), 0 18px 34px rgba(50,28,14,.28);
    rotate: -1.4deg;
  }
  body.is-open #cover{
    transform: translate(-50%,-50%) rotateY(-108deg);
    opacity:0;
    pointer-events:none;
  }
  .cover-img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    border-radius:14px;
  }
  .tap-hint{
    position:absolute;
    left:50%; bottom:16px;
    transform:translateX(-50%);
    background:rgba(248,241,226,.92);
    color:var(--maroon-deep);
    padding:7px 16px;
    border-radius:999px;
    font-size:15px;
    white-space:nowrap;
    box-shadow:0 4px 10px rgba(50,28,14,.22);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:translateX(-50%) scale(1); }
    50%{ transform:translateX(-50%) scale(1.06); }
  }

  /* ---------- SPREAD ---------- */
  #spreadPos{
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
  }
  #spread{
    display:flex;
    align-items:center;
    gap:16px;
    transform-style:preserve-3d;
    transform: rotateY(62deg);
    opacity:0;
    transition: transform .65s cubic-bezier(.4,.1,.2,1) .1s, opacity .5s ease .1s;
  }
  body.is-open #spread{
    transform: rotateY(0deg);
    opacity:1;
  }

  .page{
    position:relative;
    border-radius:12px;
    overflow:hidden;
    box-shadow: 0 3px 8px rgba(50,28,14,.16), 0 14px 26px rgba(50,28,14,.24);
    background:var(--cream);
  }
  #leftPage{ width:calc(var(--pageH) * 0.8); height:var(--pageH); rotate:-0.6deg; }
  #rightPage{ width:calc(var(--pageH) * 0.9114); height:var(--pageH); rotate:0.5deg; }

  /* ---------- LEFT PAGE : envelope + letter ---------- */
  .envelope-frame{
    position:relative;
    width:100%;
    aspect-ratio:1080/1350;
    height:100%;
  }
  .envelope-frame .photo-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .envelope-frame::after{
    content:'';
    position:absolute; inset:0;
    background:rgba(20,10,5,0);
    transition:background .4s ease;
    pointer-events:none;
  }
  #leftPage.letter-out .envelope-frame::after{
    background:rgba(20,10,5,.18);
  }
  #letterImg{
    position:absolute;
    left:23%; top:13%;
    width:37%; height:auto;
    opacity:0;
    transform:rotate(-4deg) scale(.88);
    transform-origin:center bottom;
    z-index:2;
    cursor:pointer;
    touch-action:manipulation;
    filter:drop-shadow(0 6px 10px rgba(40,20,10,.28));
    transition: all .5s cubic-bezier(.2,.8,.2,1);
  }
  #leftPage.letter-out #letterImg{
    left:10%; top:6%;
    width:80%;
    opacity:1;
    transform:rotate(-1deg) scale(1);
    z-index:3;
    filter:drop-shadow(0 16px 28px rgba(40,20,10,.38));
  }
  .page-hint-btn{
    position:absolute;
    left:50%; bottom:16px;
    transform:translateX(-50%);
    z-index:4;
    max-width:86%;
    background:var(--maroon);
    color:var(--cream);
    border:none;
    padding:8px 14px;
    border-radius:16px;
    font-size:13px;
    line-height:1.25;
    white-space:normal;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(50,28,14,.28);
    touch-action:manipulation;
    transition: opacity .35s ease, transform .2s ease;
  }
  .page-hint-btn:active{ transform:translateX(-50%) scale(.96); }
  #leftPage.letter-out .page-hint-btn{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- RIGHT PAGE : candles ---------- */
  .photo-frame{
    position:relative;
    width:100%;
    aspect-ratio:1080/1185;
    flex-shrink:0;
  }
  .photo-frame .photo-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .flame{
    position:absolute;
    transform-origin:50% 86%;
    filter: drop-shadow(0 0 7px rgba(255,178,60,.55));
    will-change: transform;
  }
  .flame.is-out{
    transition: opacity .35s ease, transform .45s ease;
    opacity:0;
    transform: translateY(-10%) scale(.35);
  }
  .smoke-layer{ position:absolute; inset:0; pointer-events:none; }
  .smoke{
    position:absolute;
    width:14px; height:14px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(150,145,140,.55), rgba(150,145,140,0) 70%);
    animation: smokeRise .9s ease-out forwards;
    pointer-events:none;
  }
  @keyframes smokeRise{
    0%{ opacity:.55; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-160%) scale(2.4); }
  }

  .mic-ui{
    position:absolute;
    left:0; right:0; bottom:0;
    max-height:100%;
    z-index:4;
    background: linear-gradient(to top, rgba(248,241,226,.97) 58%, rgba(248,241,226,0) 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    padding:22px 10px 10px;
    text-align:center;
    overflow-y:auto;
  }
  .meter{
    width:100%;
    max-width:220px;
    height:8px;
    flex:none;
    background:rgba(60,30,15,.14);
    border-radius:999px;
    overflow:hidden;
    box-shadow: inset 0 1px 3px rgba(60,30,15,.25);
  }
  .meter-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--sage), var(--gold));
    border-radius:999px;
    transition: width .06s linear;
  }
  .progress{
    width:100%;
    max-width:220px;
    height:3px;
    flex:none;
    background:rgba(60,30,15,.12);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%;
    background:var(--maroon);
    border-radius:999px;
    transition: width .06s linear;
  }
  .mic-row{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:12px;
    width:100%;
  }
  #micBtn{
    background:var(--maroon);
    color:var(--cream);
    border:none;
    padding:7px 14px;
    border-radius:16px;
    font-size:12.5px;
    line-height:1.25;
    white-space:normal;
    max-width:92%;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(50,28,14,.25);
    touch-action:manipulation;
  }
  #micBtn:active{ transform:scale(.97); }
  #micBtn.hidden{ display:none; }

  .hint{ font-size:10px; color:var(--ink); opacity:.65; }
  .mic-msg{
    font-size:10px;
    color:var(--maroon-deep);
    max-width:230px;
    margin:1px 0 0;
    line-height:1.25;
    min-height:0;
  }

  /* ---------- WISH OVERLAY + CONFETTI ---------- */
  #confettiCanvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
    z-index:5;
  }
  #wishOverlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(248,241,226,0);
    opacity:0;
    pointer-events:none;
    transition: opacity .45s ease, background .45s ease;
    z-index:6;
    padding:18px;
  }
  #wishOverlay.show{
    opacity:1;
    pointer-events:auto;
    background:rgba(248,241,226,.72);
  }
  .wish-card{
    background:var(--cream);
    border-radius:16px;
    padding:22px 20px;
    text-align:center;
    box-shadow:0 12px 30px rgba(50,28,14,.35);
    max-width:250px;
    rotate:-1deg;
  }
  .wish-text{
    font-size:20px;
    color:var(--maroon-deep);
    margin:0 0 14px;
    line-height:1.35;
  }
  #relightBtn{
    background:var(--sage);
    color:var(--cream);
    border:none;
    padding:9px 18px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(50,28,14,.25);
    touch-action:manipulation;
  }
  #relightBtn:active{ transform:scale(.97); }

  /* ---------- BACK BUTTON ---------- */
  #backBtn{
    margin-top:22px;
    background:var(--cream);
    color:var(--maroon-deep);
    border:1.5px solid var(--maroon);
    padding:9px 18px;
    border-radius:999px;
    font-size:14px;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease .15s, transform .2s ease;
    box-shadow:0 4px 10px rgba(50,28,14,.16);
    touch-action:manipulation;
  }
  body.is-open #backBtn{
    opacity:1;
    pointer-events:auto;
  }
  #backBtn:active{ transform:scale(.96); }

  .https-note{
    max-width:320px;
    margin:14px auto 0;
    font-size:12px;
    text-align:center;
    color:var(--maroon-deep);
    background:rgba(248,241,226,.85);
    border-radius:10px;
    padding:8px 12px;
    line-height:1.4;
    display:none;
  }
  .https-note.show{ display:block; }

  @media (prefers-reduced-motion: reduce){
    .tap-hint{ animation:none; }
    #cover,#spread,#letterImg,#wishOverlay,#backBtn{ transition-duration:.2s; }
  }
</style>
</head>

  <p class="https-note" id="httpsNote">Микрофон работает только на https — открой эту открытку по ссылке на хостинге (не как файл на компьютере). А пока можно задувать свечи, зажав пробел на клавиатуре.</p>

<script>
(function(){
  "use strict";

  var NAME = "Аннуш";
  var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- sizing ---------------- */
  // LEFT_AR / RIGHT_AR = photo width/height ratios. --pageH is the height of
  // BOTH pages (they match). Solved so neither the total row width nor the
  // row height ever exceeds the viewport, so nothing overflows on any screen.
  var LEFT_AR = 1080/1350;
  var RIGHT_AR = 1080/1185;
  function fitPages(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var gap = 16;
    var sidePadding = 32;
    var topPadding = 110; // space reserved for stage top-padding + back button + note

    var availW = Math.min(vw - sidePadding, 900);
    var availH = Math.min(vh - topPadding, 560);

    var hByWidth = (availW - gap) / (LEFT_AR + RIGHT_AR);
    var h = Math.min(hByWidth, availH);
    if (h < 110) h = 110; // sanity floor for degenerate tiny viewports; the
                           // term above is already width/height-safe at any
                           // realistic size, so this rarely (if ever) engages
    document.documentElement.style.setProperty('--pageH', h + 'px');
  }
  window.addEventListener('resize', fitPages);
  window.addEventListener('orientationchange', fitPages);
  fitPages();

  /* ---------------- elements ---------------- */
  var cover = document.getElementById('cover');
  var backBtn = document.getElementById('backBtn');
  var leftPage = document.getElementById('leftPage');
  var letterImg = document.getElementById('letterImg');
  var letterHintBtn = document.getElementById('letterHintBtn');
  var flameEls = [document.getElementById('flameLeft'), document.getElementById('flameMid'), document.getElementById('flameRight')];
  var smokeLayer = document.getElementById('smokeLayer');
  var meterFill = document.getElementById('meterFill');
  var progressFill = document.getElementById('progressFill');
  var micBtn = document.getElementById('micBtn');
  var micMsg = document.getElementById('micMsg');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var httpsNote = document.getElementById('httpsNote');
  var confettiCanvas = document.getElementById('confettiCanvas');
  var ctx = confettiCanvas.getContext('2d');
  var photoFrame = document.querySelector('#rightPage .photo-frame');

  /* ---------------- state ---------------- */
  var isOpen = false;
  var isLetterOut = false;
  var candlesLit = true;
  var audioCtx = null, analyser = null, timeData = null, micActive = false;
  var fallbackActive = false;
  var smoothedLevel = 0;
  var blowStartTime = null;
  var lastAboveTime = null;
  var rafId = null;

  var BLOW_THRESHOLD = 0.10;
  var BEND_FLOOR = 0.02;
  var BEND_CEIL = 0.32;
  var MAX_BEND_DEG = 34;
  var SUSTAIN_MS = 500;
  var GRACE_MS = 150;

  /* ---------------- open / close ---------------- */
  function openBook(){
    if (isOpen) return;
    isOpen = true;
    document.body.classList.add('is-open');
  }
  function closeBook(){
    if (!isOpen) return;
    isOpen = false;
    document.body.classList.remove('is-open');
    if (isLetterOut){ isLetterOut = false; leftPage.classList.remove('letter-out'); }
    if (!candlesLit){ silentRelight(); }
  }
  cover.addEventListener('click', openBook);
  cover.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      openBook();
    }
  });
  backBtn.addEventListener('click', closeBook);

  /* ---------------- letter ---------------- */
  letterImg.addEventListener('click', function(e){
    e.stopPropagation();
    isLetterOut = !isLetterOut;
    leftPage.classList.toggle('letter-out', isLetterOut);
  });
  letterHintBtn.addEventListener('click', function(e){
    e.stopPropagation();
    isLetterOut = true;
    leftPage.classList.add('letter-out');
  });

  /* ---------------- mic ---------------- */
  function isSecureEnough(){
    return window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  }
  function enableMic(){
    if (!isSecureEnough()){
      httpsNote.classList.add('show');
      micMsg.textContent = 'Микрофон недоступен на этой странице. Зажми пробел, чтобы дуть.';
      return;
    }
    micBtn.disabled = true;
    micBtn.textContent = 'Подключаем...';
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false } })
      .then(function(stream){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0;
        if (analyser.getFloatTimeDomainData){
          timeData = new Float32Array(analyser.fftSize);
        } else {
          timeData = new Uint8Array(analyser.fftSize);
        }
        src.connect(analyser);
        micActive = true;
        micBtn.classList.add('hidden');
        micMsg.textContent = 'Микрофон включен — подуй 💨';
      })
      .catch(function(){
        micBtn.disabled = false;
        micBtn.textContent = 'Нажми, чтобы задуть свечи';
        micMsg.textContent = 'Не удалось включить микрофон. Зажми пробел на клавиатуре, чтобы дуть.';
      });
  }
  micBtn.addEventListener('click', enableMic);
  if (!isSecureEnough()){
    httpsNote.classList.add('show');
  }

  function computeMicLevel(){
    if (!micActive || !analyser) return 0;
    if (analyser.getFloatTimeDomainData){
      analyser.getFloatTimeDomainData(timeData);
      var sum = 0;
      for (var i=0;i<timeData.length;i++){ sum += timeData[i]*timeData[i]; }
      return Math.sqrt(sum/timeData.length);
    } else {
      analyser.getByteTimeDomainData(timeData);
      var sum2 = 0;
      for (var j=0;j<timeData.length;j++){ var v=(timeData[j]-128)/128; sum2 += v*v; }
      return Math.sqrt(sum2/timeData.length);
    }
  }

  /* ---------------- fallback (spacebar) ---------------- */
  function setFallback(active){ fallbackActive = active; }
  document.addEventListener('keydown', function(e){
    if ((e.code === 'Space' || e.key === ' ') && isOpen){
      e.preventDefault();
      setFallback(true);
    }
  });
  document.addEventListener('keyup', function(e){
    if (e.code === 'Space' || e.key === ' '){
      setFallback(false);
    }
  });
  window.addEventListener('blur', function(){ setFallback(false); });

  /* ---------------- flame animation ---------------- */
  var flamePhase = [Math.random()*10, Math.random()*10, Math.random()*10];

  function updateFlames(level, now){
    var bendT = Math.max(0, Math.min(1, (level - BEND_FLOOR) / (BEND_CEIL - BEND_FLOOR)));
    var bendDeg = bendT * MAX_BEND_DEG;
    for (var i=0;i<flameEls.length;i++){
      var el = flameEls[i];
      if (el.classList.contains('is-out')) continue;
      var idleAmp = prefersReducedMotion ? 0.6 : 2.4;
      var idle = Math.sin((now/1000) * 1.8 + flamePhase[i]) * idleAmp;
      var jitter = prefersReducedMotion ? 0 : (Math.sin(now/47 + i*13.1) * 1.1);
      var deg = idle + jitter + bendDeg;
      var scale = 1 - bendT*0.06;
      el.style.transform = 'rotate(' + deg.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
    }
  }

  function anyLit(){ return candlesLit; }

  function spawnSmoke(el){
    var rect = el.getBoundingClientRect();
    var frameRect = photoFrame.getBoundingClientRect();
    var x = rect.left - frameRect.left + rect.width*0.5;
    var y = rect.top - frameRect.top + rect.height*0.25;
    for (var k=0;k<3;k++){
      var s = document.createElement('div');
      s.className = 'smoke';
      s.style.left = (x + (Math.random()*16-8)) + 'px';
      s.style.top = (y + (Math.random()*8-4)) + 'px';
      s.style.animationDelay = (k*90) + 'ms';
      smokeLayer.appendChild(s);
      (function(node){
        setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, 1100);
      })(s);
    }
  }

  function extinguishAll(){
    candlesLit = false;
    blowStartTime = null;
    lastAboveTime = null;
    progressFill.style.width = '0%';
    flameEls.forEach(function(el, i){
      setTimeout(function(){
        spawnSmoke(el);
        el.classList.add('is-out');
        el.style.transform = '';
      }, i*90);
    });
    setTimeout(function(){
      showWish();
      burstConfetti();
    }, flameEls.length*90 + 420);
  }

  function relightAll(){
    candlesLit = true;
    flameEls.forEach(function(el){ el.classList.remove('is-out'); });
    hideWish();
    clearConfetti();
  }
  function silentRelight(){
    candlesLit = true;
    flameEls.forEach(function(el){ el.classList.remove('is-out'); });
    wishOverlay.classList.remove('show');
    clearConfetti();
  }
  relightBtn.addEventListener('click', relightAll);

  function showWish(){ wishOverlay.classList.add('show'); }
  function hideWish(){ wishOverlay.classList.remove('show'); }

  /* ---------------- blow logic ---------------- */
  function updateMeterUI(level){
    var pct = Math.max(0, Math.min(1, level/0.35))*100;
    meterFill.style.width = pct + '%';
  }
  function updateProgressUI(t){
    progressFill.style.width = (Math.max(0,Math.min(1,t))*100) + '%';
  }

  function handleBlow(level, now){
    if (!anyLit()) return;
    if (level > BLOW_THRESHOLD){
      lastAboveTime = now;
      if (blowStartTime === null) blowStartTime = now;
      var elapsed = now - blowStartTime;
      updateProgressUI(elapsed/SUSTAIN_MS);
      if (elapsed >= SUSTAIN_MS){
        extinguishAll();
      }
    } else {
      if (blowStartTime !== null && lastAboveTime !== null && (now - lastAboveTime) > GRACE_MS){
        blowStartTime = null;
        updateProgressUI(0);
      }
    }
  }

  /* ---------------- main loop ---------------- */
  function tick(now){
    var raw = fallbackActive ? 0.9 : computeMicLevel();
    smoothedLevel += (raw - smoothedLevel) * 0.35;
    updateMeterUI(smoothedLevel);
    updateFlames(smoothedLevel, now);
    handleBlow(smoothedLevel, now);
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);

  /* ---------------- confetti ---------------- */
  var confettiParticles = [];
  var confettiRunning = false;
  var confettiColors = ['#7a1f30','#d9a441','#3f5b42','#e8b7ba','#f8f1e2'];
  var confettiAnimId = null;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function sizeCanvas(){
    var r = photoFrame.getBoundingClientRect();
    confettiCanvas.width = Math.max(1, Math.round(r.width*dpr));
    confettiCanvas.height = Math.max(1, Math.round(r.height*dpr));
    confettiCanvas.style.width = r.width + 'px';
    confettiCanvas.style.height = r.height + 'px';
  }

  function burstConfetti(){
    if (prefersReducedMotion) return;
    sizeCanvas();
    var w = confettiCanvas.width, h = confettiCanvas.height;
    confettiParticles = [];
    var count = 70;
    for (var i=0;i<count;i++){
      confettiParticles.push({
        x: w*0.5 + (Math.random()*0.5-0.25)*w,
        y: h*0.35 + Math.random()*0.1*h,
        vx: (Math.random()*2-1) * 3.2 * dpr,
        vy: (-Math.random()*3.2 - 1.5) * dpr,
        g: 0.09*dpr,
        size: (4 + Math.random()*5)*dpr,
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()*0.3-0.15),
        color: confettiColors[i % confettiColors.length],
        life: 0,
        maxLife: 130 + Math.random()*60
      });
    }
    if (!confettiRunning){
      confettiRunning = true;
      confettiAnimId = requestAnimationFrame(stepConfetti);
    }
  }

  function stepConfetti(){
    var w = confettiCanvas.width, h = confettiCanvas.height;
    ctx.clearRect(0,0,w,h);
    var alive = false;
    for (var i=0;i<confettiParticles.length;i++){
      var p = confettiParticles[i];
      if (p.life > p.maxLife) continue;
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.g;
      p.rot += p.vr;
      var fade = 1 - Math.max(0, (p.life - p.maxLife*0.7) / (p.maxLife*0.3));
      if (p.y < h+20 && p.x > -20 && p.x < w+20){
        alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, fade));
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
        ctx.restore();
      }
    }
    if (alive){
      confettiAnimId = requestAnimationFrame(stepConfetti);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,w,h);
    }
  }

  function clearConfetti(){
    confettiParticles = [];
    if (confettiAnimId) cancelAnimationFrame(confettiAnimId);
    confettiRunning = false;
    var w = confettiCanvas.width, h = confettiCanvas.height;
    ctx.clearRect(0,0,w,h);
  }

  window.addEventListener('resize', function(){ if (confettiRunning) sizeCanvas(); });

})();
</script>
</body>
</html>
